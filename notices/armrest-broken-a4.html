<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Notice — Armrest Broken</title>
<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
  }

  .sheet {
    width: 210mm;
    height: 297mm;
    box-sizing: border-box;
    padding: 30mm 22mm;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    font-family: Helvetica, Arial, sans-serif;
    color: #111;
  }

  .label {
    font-size: 16pt;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #666;
  }

  .rule {
    width: 40mm;
    height: 1px;
    background: #111;
    margin: 10mm auto;
  }

  .headline {
    font-size: 58pt;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .message {
    font-size: 24pt;
    font-weight: 400;
    line-height: 1.45;
    margin: 14mm 0 0;
  }

  .thanks {
    font-size: 15pt;
    color: #666;
    margin: 18mm 0 0;
  }

  @media screen {
    body { background: #e9e9e9; padding: 20px 0; }
    .sheet { background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15); }
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="label">Notice</div>
    <div class="rule"></div>
    <h1 class="headline">Armrest<br />Broken</h1>
    <p class="message">Please do not sit on it<br />or place heavy items on it.</p>
    <p class="thanks">Thank you for your care.</p>
  </div>
</body>
</html>
